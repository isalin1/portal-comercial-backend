Diagnóstico probable
El error ocurre porque:

En create-user.dto.ts usas @IsEnum(AlgunEnum)
Ese enum NO está correctamente importado o está undefined
Cuando Docker compila el código (RUN npm run build), TypeScript lo compila pero el enum queda como undefined
Al ejecutar, class-validator intenta hacer Object.entries(undefined) y explota


Mientras revisas, puedes ver los logs del build
bash# Reconstruir el contenedor para ver DÓNDE falla exactamente
docker-compose build api 2>&1 | tee build.log

# O ver el log completo del contenedor
docker logs api_lavanderia 2>&1 | head -50

