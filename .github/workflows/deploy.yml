Mejoras opcionales
A) Deploy solo en rama específica
Si quieres deployar solo cuando hagas merge a production:
yamlon:
  push:
    branches:
      - production  # Solo deploya en esta rama
B) Notificación en Slack/Discord
Agrega al final del script:
yamlscript: |
  cd /var/www/html/api.namiatech.com/lavanderia-backend
  git pull origin main
  docker-compose down
  docker-compose build --no-cache
  docker-compose up -d
  echo "✅ Deploy completado en $(date)"
C) Rollback automático si falla
yamlscript: |
  cd /var/www/html/api.namiatech.com/lavanderia-backend
  git pull origin main
  docker-compose down
  docker-compose build --no-cache
  docker-compose up -d
  
  # Esperar 10 segundos y verificar que el contenedor está corriendo
  sleep 10
  if ! docker ps | grep -q api_lavanderia; then
    echo "❌ Deploy falló, haciendo rollback..."
    git reset --hard HEAD~1
    docker-compose down
    docker-compose build --no-cache
    docker-compose up -d
    exit 1
  fi
  
  echo "✅ Deploy exitoso"
D) Deploy múltiples ramas a diferentes entornos
yamlname: Deploy

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "path=/var/www/html/api.namiatech.com/lavanderia-backend" >> $GITHUB_OUTPUT
          else
            echo "path=/var/www/html/staging.api.namiatech.com/lavanderia-backend" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ steps.env.outputs.path }}
            git pull origin ${{ github.ref_name }}
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d

Troubleshooting
Error: "Permission denied (publickey)"
Verifica que la clave SSH esté correcta:
bash# En tu local
cat ~/.ssh/id_rsa

# En el VPS
cat ~/.ssh/authorized_keys
Error: "Host key verification failed"
Agrega StrictHostKeyChecking=no al workflow:
