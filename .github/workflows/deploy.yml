Solución rápida: Cambiar a imagen Debian
Reemplaza node:18-alpine por node:18 (Debian):
dockerfileFROM node:18

WORKDIR /app

# Copiar archivos de dependencias
COPY package*.json ./

# Instalar todas las dependencias
RUN npm install

# Copiar todo el código
COPY . .

# Generar Prisma
RUN npx prisma generate

# Compilar
RUN npm run build

EXPOSE 3002

CMD ["node", "dist/src/main.js"]

Alternativa: Mantener Alpine pero agregar dependencias
Si prefieres seguir usando Alpine (más liviana), agrega las librerías necesarias:
dockerfileFROM node:18-alpine

WORKDIR /app

# Instalar dependencias del sistema necesarias para crypto
RUN apk add --no-cache \
    python3 \
    make \
    g++ \
    libc6-compat

# Copiar archivos de dependencias
COPY package*.json ./

# Instalar todas las dependencias
RUN npm install

# Copiar todo el código
COPY . .

# Generar Prisma
RUN npx prisma generate

# Compilar
RUN npm run build

EXPOSE 3002

CMD ["node", "dist/src/main.js"]

