name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            # Crear directorio si no existe
            mkdir -p /var/www/html/api.namiatech.com
            
            if [ ! -d "/var/www/html/api.namiatech.com/lavanderia-backend" ]; then
              echo "📦 Clonando repositorio por primera vez..."
              cd /var/www/html/api.namiatech.com
              git clone https://github.com/TU_USUARIO/TU_REPOSITORIO.git lavanderia-backend
            fi

            cd /var/www/html/api.namiatech.com/lavanderia-backend
            git pull origin main
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker logs --tail 50 api_lavanderia