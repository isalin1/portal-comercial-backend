nginx/1.24.0 (Ubuntu)y dockerMostrar másEl problema es claro: tu contenedor api_lavanderia está en un bucle de reinicio constante debido a un error de TypeScript/JavaScript. El error indica que un enum está siendo undefined o null en el archivo create-user.dto.js línea 80.
Solución paso a paso:
1. Revisar el archivo fuente create-user.dto.ts
Busca en tu código fuente la línea ~80 del DTO:
bashcat src/user/dto/create-user.dto.ts
El problema típico es algo como esto:
typescript// ❌ INCORRECTO - El enum no está importado correctamente
@IsEnum(UserRole)  // UserRole es undefined
role: string;
Soluciones posibles:
Opción A: El enum no está exportado o importado correctamente
typescript// Verifica que el enum esté bien definido
// user/enums/user-role.enum.ts
export enum UserRole {
  ADMIN = 'admin',
  USER = 'user',
  GUEST = 'guest'
}

// En create-user.dto.ts
import { UserRole } from '../enums/user-role.enum';

@IsEnum(UserRole)
role: UserRole;
Opción B: Si el enum está en Prisma, asegúrate de que esté generado
typescriptimport { UserRole } from '@prisma/client';

@IsEnum(UserRole)
role: UserRole;
