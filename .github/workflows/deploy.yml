Solución 3: Polyfill de crypto
Si usas una versión vieja de Node o hay conflicto, agrega un polyfill.
Crea el archivo src/crypto-polyfill.ts:
typescriptimport { webcrypto } from 'crypto';

if (!globalThis.crypto) {
