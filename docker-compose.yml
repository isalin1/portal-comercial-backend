services:
  api:
    build: .
    container_name: api_portal_comercial
    restart: always
    environment:
      DATABASE_URL: postgres://user:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: production
    ports:
      - "3002:3002"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: portal_comercial_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - portal-comercial-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

volumes:
  portal-comercial-data:
